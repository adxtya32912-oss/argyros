<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGYROS</title>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&family=Syne:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#0c0c0f;
color:#eaeaea;
font-family:'Space Grotesk',sans-serif;
overflow-x:hidden;
}

/* subtle grain */
body::before{
content:"";
position:fixed;
inset:0;
background:url('https://www.transparenttextures.com/patterns/asfalt-light.png');
opacity:.05;
pointer-events:none;
z-index:999;
}

/* header */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 50px;
position:fixed;
width:100%;
top:0;
background:rgba(12,12,15,.7);
backdrop-filter:blur(10px);
z-index:100;
}

.brand{
font-family:'Unbounded',sans-serif;
font-weight:900;
letter-spacing:4px;
font-size:22px;
cursor:pointer;
}

nav span{
margin-left:30px;
cursor:pointer;
font-size:13px;
letter-spacing:2px;
}

.page{
display:none;
padding:140px 70px 100px;
min-height:100vh;
}

.active{display:block}

/* hero */
.hero{
font-family:'Unbounded',sans-serif;
font-weight:900;
font-size:clamp(60px,9vw,120px);
letter-spacing:-4px;
margin-bottom:80px;
background:linear-gradient(90deg,#ffffff,#bdbdbd,#ffffff);
-webkit-background-clip:text;
color:transparent;
}

/* polaroid grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:60px;
}

.polaroid{
background:#111;
padding:18px 18px 40px 18px;
border:1px solid rgba(255,255,255,.08);
transform:rotate(-1deg);
transition:.4s;
cursor:pointer;
}

.polaroid:nth-child(2){
transform:rotate(1.2deg);
}

.polaroid:hover{
transform:rotate(0deg) scale(1.03);
border:1px solid rgba(255,255,255,.25);
}

.polaroid img{
width:100%;
height:360px;
object-fit:cover;
background:#1a1a1a;
}

.polaroid p{
margin-top:18px;
font-size:14px;
letter-spacing:1px;
opacity:.8;
}

/* product page */
.product-wrap{
display:grid;
grid-template-columns:1fr 1fr;
gap:80px;
}

.product-wrap img{
width:100%;
height:520px;
object-fit:cover;
background:#1a1a1a;
border:1px solid rgba(255,255,255,.08);
}

.product-info h2{
font-family:'Syne',sans-serif;
font-size:28px;
margin-bottom:20px;
letter-spacing:2px;
}

.sizes button{
background:none;
border:1px solid rgba(255,255,255,.2);
color:#eaeaea;
padding:8px 16px;
margin-right:10px;
margin-bottom:15px;
cursor:pointer;
font-size:13px;
}

.sizes button.activeSize{
background:#eaeaea;
color:#000;
}

.action-btn{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
cursor:pointer;
font-weight:600;
letter-spacing:1px;
background:#eaeaea;
color:#000;
}

/* cart */
.cart-item{
display:flex;
justify-content:space-between;
margin-bottom:15px;
padding-bottom:10px;
border-bottom:1px solid rgba(255,255,255,.1);
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
background:#111;
border:1px solid rgba(255,255,255,.1);
color:#fff;
}

.checkout-btn{
padding:14px;
width:100%;
background:#eaeaea;
border:none;
cursor:pointer;
font-weight:600;
}

@media(max-width:900px){
.product-wrap{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<header>
<div class="brand" onclick="showPage('home')">ARGYROS</div>
<nav>
<span onclick="showPage('home')">SHOP</span>
<span onclick="showPage('cart')">CART (<span id="cartCount">0</span>)</span>
</nav>
</header>

<!-- HOME -->
<section id="home" class="page active">
<div class="hero">BE FLY</div>

<div class="grid">

<div class="polaroid" onclick="openProduct(0)">
<img src="IMAGE_URL_HERE" alt="">
<p>8-Ball Hand Painted Baggy Jeans</p>
</div>

<div class="polaroid" onclick="openProduct(1)">
<img src="IMAGE_URL_HERE" alt="">
<p>&nbsp;</p>
</div>

</div>
</section>

<!-- PRODUCT -->
<section id="product" class="page">
<div class="product-wrap">
<img id="productImage" src="" alt="">
<div class="product-info">
<h2 id="productTitle"></h2>

<div class="sizes">
<button onclick="selectSize(this)">S</button>
<button onclick="selectSize(this)">M</button>
<button onclick="selectSize(this)">L</button>
<button onclick="selectSize(this)">XL</button>
</div>

<button class="action-btn" onclick="addToCart()">ADD TO CART</button>
<button class="action-btn" onclick="buyNow()">BUY NOW</button>

</div>
</div>
</section>

<!-- CART -->
<section id="cart" class="page">
<h2 style="margin-bottom:30px;">CART</h2>
<div id="cartItems"></div>
<button class="checkout-btn" onclick="showPage('checkout')">PROCEED TO CHECKOUT</button>
</section>

<!-- CHECKOUT -->
<section id="checkout" class="page">
<h2 style="margin-bottom:30px;">CHECKOUT</h2>
<input placeholder="Full Name">
<input placeholder="Address">
<input placeholder="City">
<input placeholder="Postal Code">
<input placeholder="Phone">
<button class="checkout-btn" onclick="completeOrder()">PLACE ORDER</button>
</section>

<script>
let products=[
{
name:"8-Ball Hand Painted Baggy Jeans",
image:"IMAGE_URL_HERE"
},
{
name:"",
image:"IMAGE_URL_HERE"
}
];

let cart=[];
let currentProduct=null;

function showPage(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function openProduct(index){
currentProduct=products[index];
document.getElementById('productTitle').textContent=currentProduct.name;
document.getElementById('productImage').src=currentProduct.image;
showPage('product');
}

function selectSize(btn){
btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('activeSize'));
btn.classList.add('activeSize');
}

function addToCart(){
let size=document.querySelector('.sizes .activeSize');
if(!size){alert("Select size");return;}
cart.push({name:currentProduct.name,size:size.textContent});
updateCart();
alert("Added to cart");
}

function buyNow(){
addToCart();
showPage('checkout');
}

function updateCart(){
document.getElementById('cartCount').textContent=cart.length;
let container=document.getElementById('cartItems');
container.innerHTML="";
cart.forEach((item,i)=>{
container.innerHTML+=`
<div class="cart-item">
<div>${item.name} - ${item.size}</div>
<div onclick="removeItem(${i})" style="cursor:pointer;">X</div>
</div>`;
});
}

function removeItem(i){
cart.splice(i,1);
updateCart();
}

function completeOrder(){
alert("Order placed. Payment integration goes here.");
cart=[];
updateCart();
showPage('home');
}
</script>

</body>
</html>
